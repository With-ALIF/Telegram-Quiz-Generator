<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>

    <!-- Logo Shape Gradients -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="planeWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow Effects Inside -->
  <circle cx="160" cy="160" r="120" fill="#3b82f6" opacity="0.25" filter="url(#glow)" />
  <circle cx="360" cy="360" r="110" fill="#a855f7" opacity="0.25" filter="url(#glow)" />
  <circle cx="360" cy="150" r="70" fill="#f43f5e" opacity="0.2" filter="url(#glow)" />

  <!-- Main Central Icon Group -->
  <g filter="url(#subtleShadow)">
    <!-- Telegram Plane Inspired Base Form -->
    <path d="M120 252 L364 140 C374 135 385 146 380 156 L312 376 C308 388 293 391 285 381 L234 322 L298 226 L196 300 L140 282 C126 277 125 259 139 254 Z" 
          fill="url(#planeGrad)" />
    
    <!-- Wing Top Highlight for 3D Depth -->
    <path d="M139 254 L364 140 C374 135 381 143 378 152 L300 224 L196 300 L140 282 C126 277 125 259 139 254 Z" 
          fill="url(#planeWing)" opacity="0.85" />
    
    <!-- Telegram Back Fold Shadow -->
    <path d="M234 322 L230 364 C230 373 241 378 247 371 L270 348 Z" 
          fill="#1e3a8a" opacity="0.9" />

    <!-- Quiz Question Mark Embedded Accent -->
    <g transform="translate(190, 85)">
      <!-- Glowing Background Disk for Question Mark -->
      <circle cx="105" cy="115" r="76" fill="#0f172a" opacity="0.9" stroke="url(#qGrad)" stroke-width="4" filter="url(#glow)" />
      
      <!-- Styled '?' Icon -->
      <path d="M85 88 C85 70 95 56 114 56 C131 56 142 67 142 81 C142 96 132 105 120 114 C112 120 108 126 108 138 L108 142" 
            fill="none" stroke="url(#qGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="108" cy="164" r="7.5" fill="#f43f5e" />
    </g>

    <!-- Quiz Success Verification Check Badge -->
    <g transform="translate(340, 310)">
      <circle cx="34" cy="34" r="32" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="2.5" />
      <circle cx="34" cy="34" r="26" fill="url(#checkGrad)" />
      <path d="M24 35 L31 42 L45 27" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- AI Sparkle 1 (Top Left) -->
    <path d="M125 110 C125 126 112 138 96 138 C112 138 125 151 125 166 C125 151 138 138 154 138 C138 138 125 126 125 110 Z" 
          fill="url(#sparkGrad)" filter="url(#glow)" />

    <!-- AI Sparkle 2 (Bottom Left) -->
    <path d="M96 350 C96 360 88 368 78 368 C88 368 96 376 96 386 C96 376 104 368 114 368 C104 368 96 360 96 350 Z" 
          fill="#38bdf8" opacity="0.85" />
  </g>
</svg>
