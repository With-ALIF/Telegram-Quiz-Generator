<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="optionCorrect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="240" fill="#38bdf8" opacity="0.18" filter="url(#ogGlow)" />
  <circle cx="950" cy="450" r="260" fill="#6366f1" opacity="0.2" filter="url(#ogGlow)" />
  <circle cx="650" cy="180" r="180" fill="#f43f5e" opacity="0.12" filter="url(#ogGlow)" />

  <!-- LEFT BRANDING COLUMN -->
  <g transform="translate(80, 85)">
    <!-- Small Category Pill -->
    <rect width="190" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">POLL.MNR.BD</text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Tele<tspan fill="url(#primaryGrad)">Quiz</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94a3b8">
      AI Telegram Quiz &amp; Poll Generator
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#64748b" width="460">
      Instant MCQ quiz creation from text or images using
    </text>
    <text x="0" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#64748b">
      Google Gemini AI. Direct channel broadcast with explanations.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Gemini 2.5 Flash AI</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(225, 0)">
        <rect width="230" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🇧🇩 বাংলা ও English Support</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 50)">
        <rect width="210" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📸 Image-to-Quiz OCR</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(225, 50)">
        <rect width="230" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 Telegram Bot Integration</text>
      </g>
    </g>

    <!-- Author Badge Footer -->
    <g transform="translate(0, 395)">
      <circle cx="20" cy="20" r="18" fill="#3b82f6" />
      <text x="14" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">A</text>
      <text x="48" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Abdullah Al Khalid Alif</text>
      <text x="48" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">Creator • alif.mnr.bd/projects/telegram-quiz-generator</text>
    </g>
  </g>

  <!-- RIGHT MOCKUP CARD (Telegram Interactive Poll Mockup) -->
  <g transform="translate(640, 65)" filter="url(#cardShadow)">
    <!-- Glassmorphic Card Container -->
    <rect width="480" height="500" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top Telegram Header -->
    <g transform="translate(24, 24)">
      <!-- Channel Avatar -->
      <rect width="44" height="44" rx="22" fill="#2563eb" />
      <path d="M15 22 L31 15 L26 31 L22 26 Z" fill="#ffffff" />

      <!-- Channel Name & Status -->
      <text x="56" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">TeleQuiz Official Bot</text>
      <text x="56" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">Anonymous Quiz Poll • 1,420 votes</text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="84" x2="456" y2="84" stroke="#334155" stroke-width="1" />

    <!-- Quiz Question Text -->
    <g transform="translate(24, 106)">
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">
        বিশ্বের বৃহত্তম ম্যানগ্রোভ বন কোনটি?
      </text>
      <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
        (Select the correct multiple-choice option)
      </text>
    </g>

    <!-- Quiz Options -->
    <g transform="translate(24, 170)">
      <!-- Option 1 -->
      <rect width="432" height="46" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="24" cy="23" r="8" fill="none" stroke="#64748b" stroke-width="2" />
      <text x="44" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">আমাজন বন (Amazon)</text>
      <text x="390" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">12%</text>

      <!-- Option 2 (Correct) -->
      <g transform="translate(0, 56)">
        <rect width="432" height="46" rx="12" fill="url(#optionCorrect)" stroke="#10b981" stroke-width="1.5" />
        <circle cx="24" cy="23" r="10" fill="#10b981" />
        <path d="M19 23 L22 26 L29 19" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <text x="44" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">সুন্দরবন (Sundarbans)</text>
        <text x="390" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#10b981">78%</text>
      </g>

      <!-- Option 3 -->
      <g transform="translate(0, 112)">
        <rect width="432" height="46" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="24" cy="23" r="8" fill="none" stroke="#64748b" stroke-width="2" />
        <text x="44" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">বোর্নিও ম্যানগ্রোভ</text>
        <text x="396" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">6%</text>
      </g>

      <!-- Option 4 -->
      <g transform="translate(0, 168)">
        <rect width="432" height="46" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="24" cy="23" r="8" fill="none" stroke="#64748b" stroke-width="2" />
        <text x="44" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">ফ্লোরিডা কোস্টাল</text>
        <text x="396" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">4%</text>
      </g>
    </g>

    <!-- Explanation Box at Bottom of Mockup -->
    <g transform="translate(24, 400)">
      <rect width="432" height="74" rx="12" fill="#020617" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">💡 AI Explanation / ব্যাখ্যা:</text>
      <text x="16" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        সুন্দরবন বিশ্বের বৃহত্তম অবিচ্ছিন্ন ম্যানগ্রোভ বন, যা বাংলাদেশ ও ভারতে বিস্তৃত।
      </text>
    </g>
  </g>
</svg>
